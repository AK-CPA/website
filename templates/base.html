<!DOCTYPE html>
<html lang="{{ site.language or 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ site.title }}{% endblock %}</title>
  <meta name="description" content="{% block description %}{{ site.description }}{% endblock %}">
  <link rel="preload" href="/fonts/plex-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css">
  <script>
    try { var t = localStorage.getItem('theme'); } catch (e) {}
    document.documentElement.setAttribute('data-theme', t || '{{ site.default_theme or "light" }}');
  </script>
</head>
<body>
  <main>
    <header class="site-header">
      {% block name %}<p class="name"><a href="/">{{ site.name }}</a></p>{% endblock %}
      <button class="theme-toggle" type="button">dark mode</button>
    </header>
    {% block content %}{% endblock %}
  </main>
  <script src="/theme.js"></script>
</body>
</html>
